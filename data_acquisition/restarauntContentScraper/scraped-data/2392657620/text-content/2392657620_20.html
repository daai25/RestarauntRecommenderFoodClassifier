<div class="image-subtitle-wrapper"><div class="image-subtitle sqs-dynamic-text"><p class="" style="white-space:pre-wrap;"><em>Die Kleine Freiheit war schon immer ein Ort für gute Gespräche und das Treffen mit Freund*innen, um dem schnellen Stadtleben kurz zu entfliehen. Aber diesen Sommer legen wir noch eine Schippe drauf – und zwar richtig!</em></p><p class="" style="white-space:pre-wrap;"><em>Unser Garten wird zur Kleinen Bühne – ein Ort für lokale Kultur, gute Gespräche und gemeinsames Erleben. Hier wird gelacht, diskutiert, getanzt und gefeiert – so fühlt sich echte Freiheit an.</em></p><p class="" style="white-space:pre-wrap;"><strong><em>Fast jeden Samstag</em></strong><em> gibt’s bei uns ein kleines, feines Programm: Bingo-Abende, Pflanzen-Workshops, Live-Musik...und mehr</em></p></div></div>
