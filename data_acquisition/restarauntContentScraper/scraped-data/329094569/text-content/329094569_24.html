<!DOCTYPE html>
<html id="ng-app" lang="{{ language }}" ng-app="widgetApp"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="Sun, 01 Jan 2014 00:00:00 GMT" http-equiv="expires"/><meta content="no-cache" http-equiv="pragma"/><link href="favicon.png" rel="icon"/></head><body style="display:none"><div class="supercontainer"><div ng-class="{ 'reservation-box': true, 'reservation-box-modal': isModal }"><maintenance ng-if="maintenance"></maintenance><div ng-if="!maintenance" style="display:contents"><div class="loader-box" ng-class="{'payment-loader': paymentInitiated, 'full-screen-loader': !isIframe}" ng-show="loading"><img class="loader" src="a620c3a27f39ca361323.gif"/></div><header><ul class="steps clear" ng-show="state == 'ok'"><li ng-class="{
                    'active' : step == currentVisibleStep,
                    'inactive': isStepAhead(step),
                    'done' : isStepDone(step)
                    }" ng-repeat="step in visibleSteps"><button type="button"><i class="glyphicon glyphicon-ok"></i> <span class="number">{{ getStepIndex(step) + 1 }}</span></button></li></ul><div class="closeIcon" ng-click="closeParentModal()" ng-show="isModal">✕</div></header><div class="reservation-inner" resize=""><div autoscroll="true" ng-view=""><ng-include src="table"></ng-include></div><footer><hr class="clearer"/><ul class="language-switcher"><li ng-repeat="myLanguage in languages"><button ng-class="{
                                'selected' : myLanguage == language,
                                'last': $last
                                }" ng-click="changeLanguage(myLanguage)">{{ myLanguage }} <span>|</span></button></li></ul><div class="provided"><div class="col-25">{{ showProvided ? 'Service provided by ' : '&amp;nbsp'}}</div><div class="col-50" ng-if="logo.src"><a ng-href="{{ logo.target }}" target="_blank"><img ng-src="{{ logo.src }}"/></a></div></div><hr class="clearer"/></footer><div class="privacy-bar"><a href="{{ language === 'de' ? 'https://go.foratable.com/datenschutzerklaerung-gaeste' : 'https://go.foratable.com/data-protection-policy-guests'}}" rel="noopener" target="_blank">{{ text.data_privacy_policy || 'Privacy policy' }} </a><a href="https://go.foratable.com/impressum" rel="noopener" target="_blank">{{ text.impressum || 'Impressum' }}</a></div><hr class="clearer"/></div></div></div></div></body></html>
