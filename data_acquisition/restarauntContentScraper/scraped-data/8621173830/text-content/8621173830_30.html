<p>Das Yooji‘s Bahnhof St. Gallen bietet eine breite Auswahl an Sushi-Kreationen, Suppen, Salaten, Poké, Snacks und Desserts. Das gesamte Angebot ist im Take Out tagesfrisch zum Mitnehmen erhältlich. Wer es gemütlicher mag, verpflegt sich am hochmodernen Kaiten (Sushi-Laufband) mit insgesamt 32 Sitzplätzen. Dort ist jeder Sitzplatz mit einem Tablet zum Surfen, Spielen und direkt bestellen ausgestattet.<br/></p>
<p><br/><strong>ALL-YOU-CAN-EAT-</strong><strong>SUSHI-SUNDAY<br/></strong><br/>Jeden Sonntag erwartet dich im Yooji’s St. Gallen ein All-You-Can-Eat-Sushi-Angebot inkl. eines Welcome Drinks. <br/>(1 Glas Prosecco oder Softdrink) Geniesse so viel Sushi, wie du möchtest – für CHF 69 kannst du alles essen, was sich auf dem Laufband befindet. Für weiterführende Informationen wende dich gerne an unser Servicepersonal vor Ort.</p>
<p>Nur in Yooji’s St. Gallen – reserviere jetzt!</p>
