<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Bildanzeige Testseite</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h2 {
      margin-top: 40px;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }
    .gallery img {
      width: 200px;
      height: auto;
      border: 2px solid #ccc;
      border-radius: 5px;
    }
    .img-label {
      text-align: center;
      font-size: 14px;
      margin-top: 5px;
    }
    .img-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>

  <h1>Bild-Testseite</h1>

  <h2>Food-Bilder</h2>
  <div class="gallery">
    <div class="img-container"><img src="images/food (1).jpg" alt="food 1"><div class="img-label">food (1).jpg</div></div>
    <div class="img-container"><img src="images/food (2).jpg" alt="food 2"><div class="img-label">food (2).jpg</div></div>
    <div class="img-container"><img src="images/food (3).jpg" alt="food 3"><div class="img-label">food (3).jpg</div></div>
    <div class="img-container"><img src="images/food (4).jpg" alt="food 4"><div class="img-label">food (4).jpg</div></div>
    <div class="img-container"><img src="images/food (5).jpg" alt="food 5"><div class="img-label">food (5).jpg</div></div>
    <div class="img-container"><img src="images/food (6).jpg" alt="food 6"><div class="img-label">food (6).jpg</div></div>
    <div class="img-container"><img src="images/food (7).jpg" alt="food 7"><div class="img-label">food (7).jpg</div></div>
  </div>

  <h2>Not-Food-Bilder</h2>
  <div class="gallery">
    <div class="img-container"><img src="images/not_food (1).jpg" alt="not food 1"><div class="img-label">not_food (1).jpg</div></div>
    <div class="img-container"><img src="images/not_food (2).jpg" alt="not food 2"><div class="img-label">not_food (2).jpg</div></div>
    <div class="img-container"><img src="images/not_food (3).jpg" alt="not food 3"><div class="img-label">not_food (3).jpg</div></div>
    <div class="img-container"><img src="images/not_food (4).jpg" alt="not food 4"><div class="img-label">not_food (4).jpg</div></div>
    <div class="img-container"><img src="images/not_food (5).jpg" alt="not food 5"><div class="img-label">not_food (5).jpg</div></div>
    <div class="img-container"><img src="images/not_food (6).jpg" alt="not food 6"><div class="img-label">not_food (6).jpg</div></div>
    <div class="img-container"><img src="images/not_food (7).jpg" alt="not food 7"><div class="img-label">not_food (7).jpg</div></div>
  </div>

</body>
</html>
